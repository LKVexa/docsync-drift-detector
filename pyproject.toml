[build-system]
requires = ["setuptools>=78,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "docsync-drift-detector"
version = "0.1.2a1"
description = "Read-only Python interface and Markdown drift reports with grounded draft patches"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-NOTICES.md"]
authors = [{name = "RUSSELL PHILIP SMITHSON"}]
dependencies = []

[tool.setuptools.packages.find]
include = ["docsync*"]
